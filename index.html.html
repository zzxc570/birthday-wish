<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #ff4b5c;
            margin-bottom: 20px;
        }

        p {
            color: #555555;
            margin-bottom: 25px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff4b5c;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            background-color: #ff4b5c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #e03a4b;
        }

        .hidden {
            display: none;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Step 1: Password Screen -->
    <div id="login-box" class="card">
        <h1>Welcome! 🎁</h1>
        <p>Ek secret message dekhne ke liye password enter kijiye:</p>
        <input type="password" id="password" placeholder="Password enter karein">
        <button onclick="checkPassword()">Unlock Wish</button>
        <p id="error-msg" class="error hidden">Galat password! Phir se try karein.</p>
    </div>

    <!-- Step 2: Birthday Message Screen -->
    <div id="birthday-box" class="card hidden">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Aapko janamdin ki bohot bohot badhaaiyan! Aapka din khushiyon se bhara rahe! 🎈✨</p>
    </div>

    <script>
        function checkPassword() {
            // Yahan apna secret password set karein
            const correctPassword = "1234"; 

            const userInput = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");
            const loginBox = document.getElementById("login-box");
            const birthdayBox = document.getElementById("birthday-box");

            if (userInput === correctPassword) {
                loginBox.classList.add("hidden");
                birthdayBox.classList.remove("hidden");
            } else {
                errorMsg.classList.remove("hidden");
            }
        }
    </script>

</body>
</html>
